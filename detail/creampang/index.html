<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>크림팡 상세페이지 검토</title>
<style>
  :root {
    --lavender: #D9AFCA;
    --purple-ui: #8B5A83;
    --purple-field: #9B6B9E;
    --ink: #2b2620;
    --bg: #faf9f5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 20px;
    background: #fff;
    border-bottom: 1px solid #ece6dd;
    overflow-x: auto;
    flex: none;
  }
  nav .brand {
    font-weight: 700;
    font-size: 14px;
    color: var(--purple-ui);
    margin-right: 16px;
    white-space: nowrap;
  }
  nav a {
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    color: #9a9187;
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  nav a:hover { background: #f3ede4; color: var(--ink); }
  nav a.active { background: var(--lavender); color: #5c3a55; }
  nav a.pending { color: #c8beb1; }
  nav a.pending::after { content: " ・진행중"; font-weight: 400; font-size: 11px; }
  main {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
<nav>
  <span class="brand">코코힐리 상세페이지 검토</span>
  <a href="../creampang/" class="active">크림팡</a>
  <a href="../sunnypang/" class="pending">써니팡</a>
  <a href="../cubenail/">큐브네일</a>
  <a href="../cubelipbalm/" class="pending">큐브립밤</a>
  <a href="../immuimmumask/" class="pending">마스크팩</a>
</nav>
<main>
  <iframe src="page.html" title="크림팡 상세페이지"></iframe>
</main>
</body>
</html>
